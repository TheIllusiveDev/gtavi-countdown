[workspace]
members = ["crates/core", "crates/app", "crates/timesync"]
resolver = "3"

[workspace.package]
version = "1.0.0"
license = "Unlicense"
edition = "2024"
rust-version = "1.95"
publish = false

[profile.release]
# One codegen unit and link-time optimisation let the compiler discard
# everything the app does not call.
codegen-units = 1
lto = true
panic = "abort"
strip = true
