<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#170b2e" />
    <meta
      name="description"
      content="A live countdown to the release of Grand Theft Auto VI on November 19, 2026."
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GTA VI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GTA VI Countdown" />
    <meta
      property="og:description"
      content="A live countdown to the release of Grand Theft Auto VI on November 19, 2026."
    />
    <meta name="twitter:card" content="summary" />
    <!-- Relative, so the site can be served from any path. -->
    <base href="./" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/GtaviCountdown.UI/app.css" />
    <link rel="stylesheet" href="GtaviCountdown.Web.styles.css" />
    <title>GTA VI Countdown</title>
    <style>
      /* Painted before the runtime loads so there is never a white flash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #170b2e;
      }
    </style>
    <script type="importmap"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="blazor-error-ui" role="alert">
      Something went wrong.
      <a href="">Reload</a>
      <span class="dismiss" aria-label="Dismiss">×</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
  </body>
</html>
